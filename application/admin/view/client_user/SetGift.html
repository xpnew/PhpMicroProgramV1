<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{$title}</title>
    <link rel="stylesheet" href="__PUBLIC__lib/layui-v2.11.6/css/layui.css" media="all">
    <link rel="stylesheet" href="__PUBLIC__css/public.css" media="all">
    <link rel="stylesheet" href="__PUBLIC__css/pagescss/butjumpup.css" />
    <script type="text/javascript" src="__PUBLIC__scripts/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="__PUBLIC__scripts/comm.js"></script>
    <script type="text/javascript" src="__PUBLIC__scripts/admin_comm.js"></script>

</head>
<body>
    <div class="layuimini-container">
        <div class="layuimini-main">


            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
                <legend>{$title}</legend>
            </fieldset>

            <form class="layui-form" action="" lay-filter="MainForm">
                <input type="hidden" name="ClientId" id="ClientId" value="{$Model.Id}" /><!-- Id主键 -->
                <input type="hidden" name="MakerLevel3Require" id="MakerLevel3Require" value="{$MakerLevel3Require}   " />
                <input type="hidden" name="ProductId" id="ProductId" value="{$ProductInfo.Id}" />
             

                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">商品名称/单价</label>
                        <div class="layui-input-inline">
                           {$ProductInfo.ProductName} / {$ProductInfo.DiscountPrice}
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">会员</label>
                        <div class="layui-input-inline">
                            {$Model.RealityName} {$Model.NickName}
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">生成数量</label>
                        <div class="layui-input-inline">
                            <input type="text" name="BuildNum" id="BuildNum" value="{$BuildNum}" class="layui-input" placeholder="请输入生成数量">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">订单价格</label>
                        <div class="layui-input-inline">
                            {$MakerLevel3Require}
                        </div>                           
                    </div>
                    
                </div>



                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn" lay-submit="" lay-filter="demo1">立即提交</button>
                        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                    </div>
                </div>

        
        </form>
    </div>
    </div>

    <script src="__PUBLIC__lib/layui-v2.11.6/layui.js" charset="utf-8"></script>
    <script>
        layui.use(['form', 'table', 'jquery'], function () {
            let $ = layui.jquery,
                form = layui.form,
                table = layui.table;
            var util = layui.util;
            var upload = layui.upload;
            var element = layui.element;





        //监听提交
        form.on('submit(demo1)', function (data) {
            console.log(data);
            Debug(data);
            // if (CheckNull(data.field.EmployeeTypeId)) {
            //     layer.alert('请选择 职员类型', { icon: 5 });
            //     return false;
            // }

            // if (null != data) return false;

            $.ajax({
                url: '/{$Request.module}/{$Request.controller}/{$Request.action}Save',
                type: 'post',
                dataType: 'json',
                data: data.field,
                success: function (data) {
                    console.log(data);
                    //Info,Success,Warning,Error
                    var type = data.Type;
                    if (0 < data.StatusCode) {
                        layer.msg(data.Title, { icon: 6, time: 2000 },
                            function () {
                                var index = parent.layer.getFrameIndex(window.name);
                                parent.layer.close(index);

                                if (parent.ReloadList)
                                    parent.ReloadList();
                                if (parent.layer.RefreshTable)
                                    parent.layer.RefreshTable();
                            });

                    } else {
                        layer.alert(data.Title, { icon: 5 });
                    }
                }
            });
            //layer.alert(JSON.stringify(data.field), {
            //    title: '最终的提交信息'
            //})
            return false;
        });








        });



    </script>
</body>
</html>
