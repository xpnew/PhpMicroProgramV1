<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{$title}</title>
    <link rel="stylesheet" href="__PUBLIC__lib/layui-v2.11.6/css/layui.css" media="all">
    <link rel="stylesheet" href="__PUBLIC__css/public.css" media="all">
    <link rel="stylesheet" href="__PUBLIC__css/pagescss/butjumpup.css" />
    <script type="text/javascript" src="__PUBLIC__scripts/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="__PUBLIC__scripts/comm.js"></script>
    <script type="text/javascript" src="__PUBLIC__scripts/admin_comm.js"></script>

</head>
<body>
    <div class="layuimini-container">
        <div class="layuimini-main">
            <fieldset class="table-search-fieldset">
                <legend>搜索 {$title}</legend>
                <div style="margin: 10px 10px 10px 10px">
                    <form class="layui-form layui-form-pane" action="">
                        <div class="layui-form-item">

                            <div class="layui-inline">
                                <label class="layui-form-label">呢称</label>
                                <div class="layui-input-inline">
                                    <input type="text" name="NickName" id="NickName" autocomplete="off" class="layui-input" />
                                </div>
                            </div>
                            <div class="layui-inline">
                                <label class="layui-form-label">手机号</label>
                                <div class="layui-input-inline">
                                    <input type="text" name="Mobile" id="Mobile" autocomplete="off" class="layui-input" />
                                </div>
                            </div>
                            
                            <div class="layui-inline">
                                <label class="layui-form-label">创客等级</label>
                                <div class="layui-input-inline">
                                    <select name="MakerLevelId" id="MakerLevelId" class="layui-select">
                                        <option value="">请选择</option>
                                            {foreach MakingLvList as $key=>$vo }
                                                <option value="{$vo.Id}">{$vo.LevelName}</option>
                                            {/foreach}           
                                    </select>
                                </div>
                            </div>

                            <div class="layui-inline">
                                <button type="submit" class="layui-btn layui-btn-primary" lay-submit
                                        lay-filter="data-search-btn">
                                    <i class="layui-icon"></i> 搜 索
                                </button>
                                <button type="button" class="layui-btn layui-btn-primary" 
                                        lay-filter="data-search-btn" id="BtShowAll">
                                    <i class="layui-icon">&#xe60f;</i> 显示全部
                                </button>
                            </div>
                        </div>
                        <div class="layui-form-item HideSearchDiv" style="display:none;">

                            <div class="layui-inline">
                                <label class="layui-form-label">注册日期</label>
                                <div class="layui-input-inline">
                                    <input type="text" id="DateRang" name="DateRang" value="" autocomplete="off" class="layui-input" placeholder="-" />                                   
                                </div>
                            </div>
                            <div class="layui-inline">
                                <label class="layui-form-label">姓名</label>
                                <div class="layui-input-inline">
                                    <input type="text" name="RealityName" id="RealityName" autocomplete="off" class="layui-input" />
                                </div>
                            </div> 
                        </div>
                    </form>
                </div>
            </fieldset>
            <script type="text/html" id="toolbarDemo">
                <div class="layui-btn-container">
                    <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add" id="AddBtn">
                        添加
                    </button>
                </div>
            </script>
        </div>       

        <table class="layui-hide" id="currentTableId" lay-filter="currentTableFilter"></table>
        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-pwd" lay-event="SetPassword">密码</a>
            <!-- <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="SetGift">发放礼包</a> -->
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit">编辑&查看</a>
        </script>

    </div>
<div id="ID-test-layer-wrapper" style="display: none;">
  <div style="padding:16px;">
    弹出已经存在于页面中的一段元素<br>
    通常是放置在 &lt;body&gt; 根节点下
  </div>
</div> <!-- 弹出层 demo end  -->

<div id="SetPassPad" style="display: none;"> 
    <form class="layui-form level3-form" action="" id="SetPassForm" lay-filter="SetPassForm">

        <input  type="hidden" id="SetPassUserId" name="SetPassUserId" value="">
        <div class="layui-form-item">
            <label class="layui-form-label required">新的密码</label>
            <div class="layui-input-block layui-input-wrap">
                <div class="layui-input-prefix layui-input-split">
                <i class="layui-icon layui-icon-password"></i>
                </div>                        
                <input type="password" name="pwd" id="pwd" lay-verify="required|pass" lay-reqtext="新的密码不能为空" placeholder="请输入密码" value="" class="layui-input" lay-affix="eye">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">确认密码</label>
            <div class="layui-input-block layui-input-wrap">
                <div class="layui-input-prefix layui-input-split">
                <i class="layui-icon layui-icon-password"></i>
                </div>              
                <input type="password" name="again_password" lay-verify="required|repass" lay-reqtext="新的密码不能为空" placeholder="确认密码" value="" class="layui-input" lay-affix="eye">
            </div>
        </div> 

        <div class="layui-form-item  layui-form-text">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea placeholder="" name="Remarks"  id="Remarks" autocomplete="off" class="layui-textarea"></textarea>
            </div>
        </div>        
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit="" lay-filter="SetPassForm-submit">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </div>      
        </div>
    </form>

</div> <!-- OptLevel end -->
    <script src="__PUBLIC__lib/layui-v2.11.6/layui.js" charset="utf-8"></script>
    <script>
        layui.use(['form', 'table', 'jquery'], function () {
            let $ = layui.jquery,
                form = layui.form,
                table = layui.table;
            var util = layui.util;
            var laydate = layui.laydate;
            laydate.render({
                elem: '#DateRang',
                range: true,
                min: -9000,
                max:30
            });
            
            table.render({
                elem: '#currentTableId',
                toolbar: '#toolbarDemo',
                method: 'post',
                url: '/{$Request.module}/{$Request.controller}/query', //数据接口
                request: {
                    pageName: 'PageIndex' //页码的参数名称，默认：page
                   ,limitName: 'PageSize' //每页数据量的参数名，默认：limit
                },
                where: {
                    Search: $('#ClassName').val()
                },
                //data: [{
                //    'privatestyle': '张三',
                //    'erptype': '2301',
                //    'labels': '膳寇'
                //},               ],
                defaultToolbar: [],
                cols: [
                    [{
                        type: 'numbers',
                        title: '序号'
                    },
                    {
                        field: 'Id',title: '推广码',align: 'center'
                    },
                    {
                        field: 'RealityName', title: '姓名', align: 'center',
                    },                      
                    {
                        field: 'MarketingLevelName',
                        title: '等级',
                        align: 'center'
                    },
                    {
                        field: 'GuiderUserId', title: '推荐人', align: 'center',
                        templet: function (d) { return DisplayUserName(d.GuiderUserId,d.GuiderNickName,d.GuiderRealName) }
                    },                      
                    {
                        field: 'Mobile',
                        title: '手机号',
                        align: 'center'
                    },                    
                    {
                        field: 'ScoreBalance',
                        title: '金果',
                        align: 'center'
                    },                    
                    {
                        field: 'IsRegionAgent', title: '区县代', align: 'center',
                        templet: function (d) { return DisplayIsEnable(d.IsRegionAgent) }
                    }, 
                    {
                        field: 'RegisterDate', title: '注册日期', align: 'center',
                        templet: function (d) { return DisplayDate(d.RegisterDate,2) }
                    },                      
                    {
                        field: 'FaceImg',
                        title: '头像',
                        align: 'center',
                        templet: function (d) {
                            if (d.FaceImg && !CheckNull(d.FaceImg)) {
                                return '<img src="' + d.FaceImg + '" style="height:30px;" />';
                            } else {
                                return '';
                            }
                        }
                    },                 


                    {
                        title: '操作',
                        toolbar: '#currentTableBar',
                        align: 'center'
                    }
                    ]
                ],
                page: true,
                limit: 15,
                limits: [10, 15, 20, 25, 50, 100],
                skin: 'grid',
                height: 'full-170'
            });
            form.on('submit(data-search-btn)', function (obj) {
                var BeginTime = ExpiryDate(0);
                var EndTime = ExpiryDate(1);

                var LoginName = $("input[name='LoginName']").val();
                var NickName = $("input[name='NickName']").val();
                var RealityName = $("input[name='RealityName']").val();
                var Mobile = $("input[name='Mobile']").val();
                var MakerLevelId = $('MakerLevelId').val();


                table.reload('currentTableId', {
                    method: 'post',
                    where: {
                        "BeginTime": BeginTime,
                        "EndTime": EndTime,
                        'LoginName': LoginName,
                        'NickName': NickName,
                        'Mobile': Mobile,
                        'RealityName': RealityName,
                        'MakerLevelId': MakerLevelId,
                    }
                }, 'data');
                return false;
            });

    /**
       * toolbar 上部功能区 监听事件  此处 针对lay-filter="" 而不是dom id
       */
    table.on('toolbar(currentTableFilter)', function (obj) {
            var ModelData = obj.data;
            if (obj.event === 'add') {  // 监听添加操作
                Debug('上部功能区 监听事件');
                var Path = '/{$Request.module}/{$Request.controller}/add';
                Path += '?_dx=' + Math.random() ;
                var index = layer.open({
                    title: '添加{$title}' ,
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: false,
                    area: ['90%', '90%'],
                    content: Path,
                    //end: function () {
                    //    RefreshTable();
                    //}
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            }
    });


            // 头部工具栏事件
            table.on('toolbar(currentTableId)', function (obj) {
                console.log(obj); // 查看对象所有成员

                var options = obj.config; // 获取当前表格属性选项
                var checkStatus = table.checkStatus(options.id); // 获取选中行相关数据

                // 根据不同的事件名进行相应的操作
                switch (obj.event) { // 对应模板元素中的 lay-event 属性值
                    case 'add':
                        layer.msg('添加');
                        break;
                    case 'delete':
                        layer.msg('删除');
                        break;
                    case 'update':
                        layer.msg('编辑');
                        break;
                };
            });



    /**
       * tool 右边操作区区 监听事件
       */
        table.on('tool(currentTableFilter)', function (obj) {
            var ModelData = obj.data;
            if (obj.event === 'edit') {  // 监听添加操作
                var Path = '/{$Request.module}/{$Request.controller}/edit';
                Path += '?_dx=' + Math.random() + '&id=' + ModelData.Id;
                var index = layer.open({
                    title: '{$title} - 修改' ,
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: false,
                    area: ['90%', '90%'],
                    content: Path,
                //    end: function () {
                //        RefreshTable();
                //    }
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            }else if(obj.event === 'SetGift'){
                var ModelData = obj.data;
                var Path = '/{$Request.module}/{$Request.controller}/SetGift';
                Path += '?_dx=' + Math.random() + '&id=' + ModelData.Id;
                var index = layer.open({
                    title: '发放礼包 - ' + DisplayMergeName(ModelData.NickName,ModelData.RealityName) ,
                    type: 2,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['500px', '600px'],
                    content: Path,
                //    end: function () {
                //        RefreshTable();
                //    }
                });


            }else if(obj.event === 'SetPassword'){
                var ModelData = obj.data;
                $('#SetPassUserId').val(ModelData.Id);
                $('#Remarks').val(ModelData.Remarks);
                
                layer.open({
                    type: 1,
                    shade: 0.3, // 不显示遮罩
                    scrollbar: false,
                    shadeClose: true,
                    maxmin: true,
                    area: ['500px', '400px'],
                    title: '修改密码 - ' + DisplayMergeName(ModelData.NickName,ModelData.RealityName),
                    content: $('#SetPassPad'), // 捕获的元素
                    end: function(){
                                         //表单初始赋值
                        form.val('SetPassForm', {  
                            "Id": ModelData.Id,
                            "pwd": "",
                            "again_password": "",       
                            "Remarks": ModelData.Remarks                



                        });
                    }
                });        

            }            
            else if (obj.event === 'delete') {
                layer.confirm('您确定要删除所选数据吗', {
                    btn: ['是的', '取消'] //按钮
                }, function () {
                    var oldData = table.cache["currentTableId"];

                    var Path = '/{$Request.module}/{$Request.controller}/delete';
                    Path += '?_dx=' + Math.random() + '&id=' + ModelData.Id;
                    $.ajax({
                        url: Path,
                        type: 'post',
                        dataType: 'json',
                        data: ModelData,
                        success: function (data) {
                            console.log(data);
                            //Info,Success,Warning,Error
                            var type = data.Type;
                            if (0  ==  data.code) {
                                layer.msg(data.msg, { icon: 6, time: 2000 }, function () { });
                                Debug("oldData", oldData);
                                for (var i = 0; i < oldData.length; i++) {
                                    row = oldData[i];
                                    if (row.Id === ModelData.Id) {
                                        Debug('has find row: ' + row.Id);
                                        oldData.splice(i, 1);    //删除一项
                                        Debug("oldData", oldData);
                                    }
                                };
                                //table.reload('currentTableId', {
                                //    data: oldData
                                //});
                                table.renderData('currentTableId');



                            } else {
                                layer.alert(data.msg, { icon: 5 });
                            }
                        }
                    }); //end ajax



                    return false;
                }, function () {
                    return;
                });
                }
            });


            form.verify({
                pass: [
                    /^[\S]{4,12}$/
                    ,'密码必须4到12位，且不能出现空格'
                ]
                ,repass: function(value){
                    Debug('repass  value :',value);
                    Debug('repass  $("#pwd").val() :',$('#pwd').val());
                    if(value != $('#pwd').val()){
                        return '两次密码不一致';
                    }
                }
            });   

            //监听提交
            form.on('submit(SetPassForm-submit)', function (data) {
                console.log(data);
                Debug(data);
                if (CheckNull(data.field.pwd)) {
                    layer.alert('必须指定 【新的密码】 ', { icon: 5 });
                    return false;
                }         
                // let PostData = data.field;
                let PostData = {...data.field, ClientUserId: $('#SetPassUserId').val()};
                // console.log('data.field', JSON.stringify(data.field));                

                // console.log('data.field',data.field);                
                console.log('PostData',PostData);
                // if (null != data) return false;
                // 在JS当中，下面这行代出错了， 是因为 data.field 是一个对象，不能用 ...data.field吗？
                // let PostData =[... data.field ]; 

                $.ajax({
                    url: '/{$Request.module}/{$Request.controller}/SetPassword',
                    type: 'post',
                    dataType: 'json',
                    data: PostData,
                    success: function (data) {
                        console.log(data);
                        //Info,Success,Warning,Error
                        var type = data.Type;
                        if (0 < data.StatusCode) {

                            var oldData = table.cache["currentTableId"];
                            Debug("oldData", oldData);
                            Debug("ostData.ClientUserId", PostData.ClientUserId);
                            let UserId = PostData.ClientUserId;
                            UserId = parseInt(UserId);
                            for (var i = 0; i < oldData.length; i++) {
                                row = oldData[i];
                                Debug('row.Id', row.Id);
                                if (row.Id === UserId) {
                                    Debug('has find row: ' + row.Id);
                                    row.Remarks = PostData.Remarks;
                                
                                    // Debug("oldData", oldData);
                                }
                            };               
                
                            layer.msg(data.Title, { icon: 6, time: 2000 },
                                function () {
                                  layer.closeLast('page'); // 关闭最近一次打开的页面层

                                });

                        } else {
                            layer.alert(data.Title, { icon: 5 });
                        }
                    }
                });
                //layer.alert(JSON.stringify(data.field), {
                //    title: '最终的提交信息'
                //})
                return false;
            });



            function RefreshTable() {
                console.log('RefreshTable');
                table.reload('currentTableId', {
                    where: {
                        //name: $('#name').val()
                    }
                }, 'data');

            }
            // 按ESC键关闭侧边栏
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && sidebar.classList.contains('active')) {
                    sidebar.classList.remove('active');
                }
            });


        });


        function ReloadList() {
            console.log('ReloadList');
           layui.table.reload('currentTableId', {
                where: {
                    //name: $('#name').val()
                }
            }, 'data');
        }
        $(function () {
            $('#BtShowAll').click(function () {
                $('.HideSearchDiv').toggle();
            });
        });        
        function ExpiryDate(idx) {
            var DataVal = $('#DateRang').val();
            if (!CheckNull(DataVal)) {
                console.log("arr: ", DataVal.split(' - '));
                return DataVal.split(' - ')[idx];
            } else {
                return null;
            }
        }
    </script>
</body>
</html>
